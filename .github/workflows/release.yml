name: 构建发布包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder: "npx electron-builder --mac --publish never"
            artifact_name: "CodeDungeon-macOS"
          - os: windows-latest
            builder: "npx electron-builder --win --publish never"
            artifact_name: "CodeDungeon-Windows"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 构建网页静态产物
        run: npm run build

      - name: 生成单文件 HTML
        run: npm run build:single

      - name: 打包桌面安装包
        run: ${{ matrix.builder }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            release/*
            !release/*.blockmap
            !release/*.yml

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
            !release/*.blockmap
            !release/*.yml
